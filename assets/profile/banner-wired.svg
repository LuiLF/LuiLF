
<svg xmlns="http://www.w3.org/2000/svg"
     width="960" height="240"
     viewBox="0 0 960 240"
     role="img"
     aria-label="Lui. Infraestrutura de TI, Redes e Cibersegurança. Learning through practice.">

  <defs>
    <!-- Gradiente de fundo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101923"/>
      <stop offset="1" stop-color="#122331"/>
    </linearGradient>

    <!-- Gradiente da linha de separacao -->
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#65C8C1" stop-opacity="0"/>
      <stop offset=".55" stop-color="#65C8C1" stop-opacity=".6"/>
      <stop offset="1" stop-color="#65C8C1" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <!-- Fundo e borda -->
  <rect width="960" height="240" rx="14" fill="url(#bg)"/>
  <rect x=".7" y=".7" width="958.6" height="238.6"
        rx="13.3" fill="none"
        stroke="#65C8C1" stroke-opacity=".11"/>

  <!-- Grade de fundo -->
  <g stroke="#65C8C1" stroke-opacity=".11"
     fill="none" stroke-width="1">
    <path d="M645 0V240M710 0V240M775 0V240M840 0V240M905 0V240"/>
    <path d="M625 42H960M625 100H960M625 158H960M625 216H960"/>
  </g>

  <!-- Circuitos decorativos -->
  <g fill="none" stroke="#65C8C1"
     stroke-width="1.3" opacity=".45">
    <path d="M628 165H674L691 147H739L757 167H803L827 115H865L881 130H960"/>
    <path d="M660 68H702L719 82H762L782 64H835L858 79H960"
          opacity=".45"/>
  </g>

  <!-- Pontos de conexao -->
  <g fill="#65C8C1">
    <circle cx="691" cy="147" r="3"/>
    <circle cx="757" cy="167" r="3"/>
    <circle cx="827" cy="115" r="3"/>
    <circle cx="858" cy="79" r="2.5"/>
  </g>

  <!-- Identidade -->
  <rect x="40" y="32" width="25" height="2.5"
        rx="1.25" fill="#65C8C1"/>

  <text x="40" y="66" fill="#65C8C1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11" letter-spacing="2.3">
    SISTEMAS  /  REDES  /  SEGURANÇA
  </text>

  <text x="40" y="123" fill="#D9E6ED"
        font-family="Arial, Helvetica, sans-serif"
        font-size="39" font-weight="700">
    Lui.
  </text>

  <text x="40" y="158" fill="#AFC6D2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17">
    Infraestrutura de TI · Redes · Cibersegurança
  </text>

  <!-- Linha de separacao -->
  <path d="M40 189H538"
        stroke="url(#signal)" stroke-width="1"/>

  <!-- Texto com cursor animado -->
  <text x="40" y="215"
        fill="#65C8C1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        letter-spacing="1.6">
    LEARNING THROUGH PRACTICE<tspan>_
      <animate attributeName="opacity"
               values="1;1;0;0"
               keyTimes="0;0.49;0.5;1"
               dur="1.2s"
               repeatCount="indefinite"/>
    </tspan>
  </text>

  <!-- Identificador do banner -->
  <text x="916" y="215" text-anchor="end"
        fill="#65C8C1" opacity=".45"
        font-family="monospace" font-size="10">
    WIRED_01
  </text>
</svg>
