
<svg xmlns="http://www.w3.org/2000/svg"
     width="360" height="230"
     viewBox="0 0 360 230"
     role="img"
     aria-label="Lui. Infraestrutura de TI, Redes e Cibersegurança. Learning through practice.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101923"/>
      <stop offset="1" stop-color="#122331"/>
    </linearGradient>

    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#65C8C1" stop-opacity="0"/>
      <stop offset=".55" stop-color="#65C8C1" stop-opacity=".6"/>
      <stop offset="1" stop-color="#65C8C1" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <rect width="360" height="230" rx="12" fill="url(#bg)"/>
  <rect x=".7" y=".7" width="358.6" height="228.6"
        rx="11.3" fill="none"
        stroke="#65C8C1" stroke-opacity=".18"/>

  <!-- Grade de fundo -->
  <g stroke="#65C8C1" stroke-opacity=".11"
     fill="none" stroke-width="1">
    <path d="M260 0V230M300 0V230M340 0V230"/>
    <path d="M240 38H360M240 85H360M240 132H360M240 179H360"/>
  </g>

  <!-- Circuito principal -->
  <path d="M240 150H255L265 136H282L293 151H308L323 113H337L346 126H360"
        fill="none"
        stroke="#65C8C1"
        stroke-width="1.3"
        opacity=".45"/>

  <!-- Circuito superior -->
  <path d="M250 70H266L275 81H292L302 67H322L333 78H360"
        fill="none"
        stroke="#65C8C1"
        stroke-width="1.3"
        opacity=".20"/>

  <!-- Pontos de conexao -->
  <g fill="#65C8C1">
    <circle cx="265" cy="136" r="2" opacity=".85"/>
    <circle cx="293" cy="151" r="2" opacity=".85"/>
    <circle cx="323" cy="113" r="2" opacity=".85"/>
    <circle cx="333" cy="78" r="1.8" opacity=".75"/>
  </g>

  <!-- Identidade -->
  <rect x="20" y="22" width="23" height="3"
        rx="1.5" fill="#65C8C1"/>

  <text x="20" y="49" fill="#65C8C1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10" letter-spacing="1.1">
    SISTEMAS / REDES / SEGURANÇA
  </text>

  <text x="20" y="106" fill="#D9E6ED"
        font-family="Arial, Helvetica, sans-serif"
        font-size="43" font-weight="700">
    Lui.
  </text>

  <text x="20" y="139" fill="#AFC6D2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Infraestrutura de TI · Redes
  </text>

  <text x="20" y="160" fill="#AFC6D2"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Cibersegurança
  </text>

  <!-- Linha de separacao -->
  <path d="M20 181H235"
        stroke="url(#signal)" stroke-width="1"/>

  <!-- Texto com cursor animado -->
  <text x="20" y="205" fill="#65C8C1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11" letter-spacing=".8">LEARNING THROUGH PRACTICE<tspan>_
      <animate attributeName="opacity"
               values="1;1;0;0"
               keyTimes="0;0.49;0.5;1"
               dur="1.2s"
               repeatCount="indefinite"/>
    </tspan>
  </text>

  <text x="339" y="217" text-anchor="end"
        fill="#65C8C1" opacity=".45"
        font-family="monospace" font-size="8">
    WIRED_01
  </text>
</svg>
