<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2" viewBox="0 0 1000 2" role="img" aria-label="Wired network signal with occasional interference">
  <g>
    <!-- Normal transmission, two interference periods, and a longer outage. -->
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.35;0.39;0.73;0.77;0.85;0.94;1"
      values="1;0.35;1;0.55;1;0;1;1"/>
    <rect width="1000" height="2" fill="#9E0000"/>
    <!-- One synchronized train: the smallest packet trails the others. -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="-480 0" to="1000 0" dur="5.5s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="18" height="2" fill="#FF7777"/>
      <rect x="230" y="0" width="150" height="2" fill="#FF4545"/>
      <rect x="415" y="0" width="65" height="2" fill="#D12B2B"/>
    </g>
  </g>
</svg>
